      description: >-
        El porcentaje SIEMPRE viene acompanado de `dadoPorIncobrable` en el mismo objeto: el
        enunciado prohibe reportarlo solo, porque el indicador puede 'mejorar' sin haber cobrado
        nada si se declaran incobrables creditos malos.
