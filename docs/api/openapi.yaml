  /creditos:
    post:
      tags:
        - Creditos
      summary: Desembolsar un credito a partir de una solicitud aprobada
      description: >-
        Evento 'Se desembolsa' (tabla 6.7.1): crea el Credito, lo liga a la PoliticaCredito vigente
        en la fecha de desembolso (seccion 6.3.1) y genera el plan de amortizacion frances (seccion
        6.4).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesembolsarCreditoRequest'
      responses:
        '201':
          description: Credito desembolsado en estado 'vigente'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credito'
        '400':
          description: >-
            Peticion invalida (falla de validacion Zod o de una guarda del dominio, p. ej. una tasa
            fuera de la razonabilidad de la seccion 6.3.1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
        '404':
          description: El recurso solicitado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
        '409':
          description: >-
            Conflicto de estado: la operacion no es valida para el estado actual del recurso (patron
            State, seccion 6.7 -- p. ej. registrar un pago sobre un credito 'solicitado').
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /creditos/{id}:
    get:
      tags:
        - Creditos
      summary: Consultar un credito
      description: >-
        `tramoMora` y `diasAtraso` se calculan a la fecha de corte indicada (clasificacion derivada,
        seccion 6.7.1); si se omite, se usa la fecha de corte del ultimo cierre.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: '2026-02-15'
          required: false
          name: fechaCorte
          in: query
      responses:
        '200':
          description: Credito encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credito'
        '404':
          description: El recurso solicitado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /creditos/{id}/plan-amortizacion:
    get:
      tags:
        - Creditos
      summary: Consultar el plan de amortizacion de un credito
      description: >-
        Reproduce cuota por cuota la tabla de la seccion 6.4, incluido el ajuste de cuadre de la
        ultima cuota.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        '200':
          description: Plan de amortizacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAmortizacion'
        '404':
          description: El recurso solicitado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /creditos/{id}/reestructuraciones:
    post:
      tags:
        - Creditos
      summary: 'Reestructurar un credito (tabla 6.7.1: ''Acuerdo de nuevas condiciones'')'
      description: >-
        Solo valido con el credito en 'en_mora' (tabla 6.7.1). Deja la marca permanente
        `reestructuradoAlgunaVez` en verdadero; esa marca nunca se borra (seccion 6.7).
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReestructurarCreditoRequest'
      responses:
        '200':
          description: Credito en estado 'reestructurado' con nuevo plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credito'
        '404':
          description: El recurso solicitado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
        '409':
          description: >-
            Conflicto de estado: la operacion no es valida para el estado actual del recurso (patron
            State, seccion 6.7 -- p. ej. registrar un pago sobre un credito 'solicitado').
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /creditos/{id}/incobrable:
    post:
      tags:
        - Creditos
      summary: Declarar incobrable un credito (baja contable, seccion 6.7)
      description: >-
        Solo valido si supera 120 dias de atraso sin arreglo. Es una baja CONTABLE, no un perdon: el
        credito sale de la cartera activa (seccion 6.8) y su cobro se terceriza; no hay camino de
        vuelta a la cartera.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclararIncobrableRequest'
      responses:
        '200':
          description: Credito en estado 'incobrable' (terminal).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credito'
        '404':
          description: El recurso solicitado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
        '409':
          description: >-
            Conflicto de estado: la operacion no es valida para el estado actual del recurso (patron
            State, seccion 6.7 -- p. ej. registrar un pago sobre un credito 'solicitado').
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /creditos/{id}/pagos:
    post:
      tags:
        - Pagos
      summary: Registrar un pago y aplicarlo segun la prelacion (seccion 6.6)
      description: >-
        Requiere el encabezado `Idempotency-Key`. Ver la seccion 'Idempotencia' del documento E5:
        reintentar la misma clave para el mismo credito devuelve 200 con el pago ya existente, en
        vez de crear uno nuevo (invariante 6.10). Un pago nunca se rechaza por ser insuficiente
        (seccion 6.6.4): siempre se registra y se aplica hasta donde alcance.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            $ref: '#/components/schemas/ClaveIdempotencia'
          required: true
          name: Idempotency-Key
          in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarPagoRequest'
      responses:
        '200':
          description: >-
            Reintento con una clave de idempotencia ya usada: se devuelve el pago original, sin
            volver a cobrarlo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
        '201':
          description: Pago registrado y aplicado por primera vez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
        '400':
          description: >-
            Peticion invalida (falla de validacion Zod o de una guarda del dominio, p. ej. una tasa
            fuera de la razonabilidad de la seccion 6.3.1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
        '404':
          description: El recurso solicitado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
        '409':
          description: >-
            Conflicto de estado: la operacion no es valida para el estado actual del recurso (patron
            State, seccion 6.7 -- p. ej. registrar un pago sobre un credito 'solicitado').
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
